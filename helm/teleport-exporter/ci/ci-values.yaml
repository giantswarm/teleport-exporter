# CI test values - provides required fields for chart testing
teleport:
  address: "teleport.example.com:443"

identity:
  existingSecret: "teleport-exporter-identity"

# app-test-suite installs with `helm --wait`; the exporter's /readyz and tbot both
# need a real Teleport backend, so the smoke test runs the exporter scaled to zero
# and without tbot (the identity comes from existingSecret above).
replicas: 0

tbot:
  enabled: false
